name: dmz-media
services:
  sonarr:
    image: linuxserver/sonarr:4.0.20
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_ADMIN  # needed by the route-via-vpn init script
    depends_on: 
      - "sabnzbd"
      - "wireguard"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ./temp-data/sonarr-config:/config
      - ./services/dmz-services/media/custom-scripts/route-via-vpn.sh:/custom-cont-init.d/10-route-via-vpn.sh:ro
      - "${TV_SHOW_PATH}:/tv"
      - ${DOWNLOAD_PATH}:/downloads
    networks:
      vpnnet-internal:
        ipv4_address: 10.10.20.6
    dns:
      - 10.10.20.4  # bind DNS container
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_ADMIN  # needed by the route-via-vpn init script
    depends_on:
      - "wireguard"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ./temp-data/sabnzbd-config:/config
      - ./services/dmz-services/media/custom-scripts/route-via-vpn.sh:/custom-cont-init.d/10-route-via-vpn.sh:ro
      - ${DOWNLOAD_PATH}:/downloads
      - ${TEMP_DOWNLOAD_PATH}:/incomplete-downloads
      - ${NZB_WATCH_PATH:-./temp-data/sabnzbd-nzb-watch}:/watch-folder
    networks:
      vpnnet-internal:
        ipv4_address: 10.10.20.3
    dns:
      - 10.10.20.4  # bind DNS container
  tdarr:
    image: haveagitgat/tdarr:3.06.00
    container_name: tdarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    depends_on:
      - wireguard
    cpus: 2
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      UMASK_SET: 002
      internalNode: true
      inContainer: true
      nodeName: ServerNode
    volumes:
      - ./temp-data/tdarr-config:/app/configs
      - ./temp-data/tdarr-logs:/app/logs
      - ./temp-data/tdarr-server:/app/server
      - "${TV_SHOW_PATH}:/media"
      - "${TRANSCODE_PATH}:/temp"
    networks:
      vpnnet:
        ipv4_address: 10.10.10.7
  wireguard:
    image: linuxserver/wireguard:1.0.20260223
    container_name: wireguard
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    networks:
      vpnnet:
        ipv4_address: 10.10.10.2
      vpnnet-internal:
        ipv4_address: 10.10.20.2
    volumes:
      - ./temp-data/wireguard-config:/config/wg_confs/
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
  swag:
    image: linuxserver/swag:5.9.0
    container_name: swag-media
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      PUID: 1000
      PGID: 1000
      TZ: "America/Toronto"
      URL: ${DOMAIN}
      VALIDATION: dns
      SUBDOMAINS: wildcard
      ONLY_SUBDOMAINS: true
      DISABLE_F2B: true
      #STAGING: true  # Set this if you want to use lets encrypt staging (testing) certs
      DNSPLUGIN: cloudflare
    secrets:
     - source: cloudfare_config
       target: /config/dns-conf/cloudflare.ini
    networks: 
      vpnnet:
        ipv4_address: 10.10.10.5
      vpnnet-internal:
        ipv4_address: 10.10.20.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./temp-data/swag-config:/config
      - ./services/reverse-proxy/sabnzbd.subdomain.conf:/config/nginx/proxy-confs/sabnzbd.subdomain.conf
      - ./services/reverse-proxy/sonarr.subdomain.conf:/config/nginx/proxy-confs/sonarr.subdomain.conf
      - ./services/reverse-proxy/tdarr.subdomain.conf:/config/nginx/proxy-confs/tdarr.subdomain.conf
  dns:
    image: internetsystemsconsortium/bind9:9.20
    container_name: dns
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./services/dmz-services/media/custom-scripts/connect-network-dns.sh:/tmp/connect-network-dns.sh:ro
      - ./services/dmz-services/media/bind9-config.conf:/etc/bind/named.conf:ro
    networks: 
      vpnnet-internal:
        ipv4_address: 10.10.20.4
    entrypoint: ["sh", "-c", "/tmp/connect-network-dns.sh"]
secrets:
  cloudfare_config:
    file: ./secrets/reverse-proxy-secrets/cloudflare.ini
networks:
  vpnnet:
    name: vpnnet
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
  vpnnet-internal:
    name: vpnnet-internal
    internal: true
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1
