services:
  plex:
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506
    container_name: plex
    restart: unless-stopped
    environment:
      TZ: "America/Toronto"
      ADVERTISE_IP: "https://plex.${DOMAIN}:443"
      PLEX_UID: ${PLEX_UID:-1000}
      PLEX_GID: ${PLEX_GID:-1000}
      # Only needed the first time the server is set up (the token expires after ~4 minutes).
      # Get one from https://plex.tv/claim and run: PLEX_CLAIM=claim-xxxx docker compose -f docker-compose-plex.yaml up -d
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    ports:
      - "32400:32400"  # Direct access for LAN clients, remove if you only want access via swag
    volumes:
      - ./temp-data/plex-config:/config
      - "${PLEX_MEDIA_PATH}:/data"
      - "${PLEX_TRANSCODE_PATH}:/transcode"
    devices:
      - "/dev/dri:/dev/dri"  # Intel Quick Sync hardware transcoding, remove if not available
    networks:
      plexnet:
        ipv4_address: 10.10.60.2
  swag:
    image: linuxserver/swag:5.9.0
    container_name: swag
    restart: unless-stopped
    depends_on:
      - plex
    security_opt:
      - no-new-privileges=true
    environment:
      PUID: 1000
      PGID: 1000
      TZ: "America/Toronto"
      URL: ${DOMAIN}
      VALIDATION: dns
      SUBDOMAINS: plex
      ONLY_SUBDOMAINS: true
      DISABLE_F2B: true
      #STAGING: true  # Set this if you want to use lets encrypt staging (testing) certs
      DNSPLUGIN: cloudflare
    secrets:
     - source: cloudfare_config
       target: /config/dns-conf/cloudflare.ini
    networks:
      plexnet:
        ipv4_address: 10.10.60.3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./temp-data/swag-plex-config:/config
      - ./services/reverse-proxy/plex.subdomain.conf:/config/nginx/proxy-confs/plex.subdomain.conf
secrets:
  cloudfare_config:
    file: ./secrets/reverse-proxy-secrets/cloudflare.ini
networks:
  plexnet:
    name: plexnet
    ipam:
      config:
        - subnet: 10.10.60.0/24
          gateway: 10.10.60.1
