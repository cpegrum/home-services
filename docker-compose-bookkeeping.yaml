name: bookkeeping
services:
  akaunting:
    image: akaunting/akaunting:3.3.0
    container_name: akaunting
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      swag:
        condition: service_started
    security_opt:
      - no-new-privileges=true
    env_file:
      - ./secrets/bookkeeping-secrets/run.env
    environment:
      AKAUNTING_SETUP: ${AKAUNTING_SETUP:-false}  # set to true for the first start only, see docs
    volumes:
      - akaunting-data:/var/www/html
      - ./services/bookkeeping-services/php.ini:/usr/local/etc/php/php.ini:ro
    networks:
      akauntingnet:
        ipv4_address: 10.10.50.2
  mariadb:
    image: mariadb:13.0.2
    container_name: mariadb
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file:
      - ./secrets/bookkeeping-secrets/db.env
    volumes:
      - akaunting-db:/var/lib/mysql
      - ./services/bookkeeping-services/maria.cnf:/etc/mysql/conf.d/maria.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      akauntingnet:
        ipv4_address: 10.10.50.3
  swag:
    image: linuxserver/swag:5.9.0
    container_name: swag-bookkeeping
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      PUID: 1000
      PGID: 1000
      TZ: "America/Toronto"
      URL: ${DOMAIN}
      VALIDATION: dns
      SUBDOMAINS: wildcard
      ONLY_SUBDOMAINS: true
      DISABLE_F2B: true
      #STAGING: true  # Set this if you want to use lets encrypt staging (testing) certs
      DNSPLUGIN: cloudflare
    secrets:
     - source: cloudfare_config
       target: /config/dns-conf/cloudflare.ini
    networks: 
      akauntingnet:
        ipv4_address: 10.10.50.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./temp-data/swag-akaunting-config:/config
      - ./services/reverse-proxy/akaunting.subdomain.conf:/config/nginx/proxy-confs/akaunting.subdomain.conf
secrets:
  cloudfare_config:
    file: ./secrets/reverse-proxy-secrets/cloudflare.ini
volumes:
  # Names are pinned so the existing volumes keep being used (they were created under the old default project name)
  akaunting-data:
    name: home-services_akaunting-data
  akaunting-db:
    name: home-services_akaunting-db
networks:
  akauntingnet:
    name: akauntingnet
    ipam:
      config:
        - subnet: 10.10.50.0/24
          gateway: 10.10.50.1
